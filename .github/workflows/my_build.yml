name: Custom Android Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ninja-build libgtk-3-dev pkg-config unzip zip
          pip3 install wheel
          pip3 install .

      - name: Setup Tools & Engine
        run: |
          # 1. Setup Depot Tools
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH=$PATH:$PWD/depot_tools
          export DEPOT_TOOLS_METRICS=0
          
          # 2. Setup Source Cache (engine)
          git clone https://github.com/flutter/flutter.git engine_cache
          cd engine_cache
          git config --global user.email "bot@example.com"
          git config --global user.name "bot"
          
          # 3. Checkout specific commit
          git fetch origin 38fddb289f1863e257f4b5b5c9323061344dcc54
          git reset --hard 38fddb289f1863e257f4b5b5c9323061344dcc54
          
          # 4. Patch the cache
          cd ..
          mv engine_cache engine
          reflutter -b e778b1230a9836052e2161a8a766cccc -p
          
          # 5. Prepare Build Environment
          mkdir build_root
          cd build_root
          
          echo 'solutions = [{"managed": False,"name": "src/flutter","url": "'$GITHUB_WORKSPACE/engine'","custom_deps": {},"deps_file": "DEPS","safesync_url": "",},]' > .gclient
          
          gclient sync --verbose --no-history

      - name: Build Android ARM64
        run: |
          export PATH=$PATH:$PWD/depot_tools
          # We are in the root of the repo
          # The sync created 'build_root/src'
          
          cd build_root/src/flutter/tools
          
          # Configure
          ./gn --no-goma --android --android-cpu=arm64 --runtime-mode=release
          
          # The GN tool generates output in: build_root/src/out/android_release_arm64
          # But we are currently in:        build_root/src/flutter/tools
          # So relative path to out is:     ../../out/android_release_arm64
          
          # Build
          ninja -C ../../out/android_release_arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libflutter_arm64
          path: build_root/src/out/android_release_arm64/lib.stripped/libflutter.so
